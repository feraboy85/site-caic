<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rematrículas 2027 | CAIC</title><style>body{margin:0;background:#f2f6fb;color:#15202b;font:16px Arial}.hero{background:#124b89;color:#fff;padding:34px 18px}.wrap{max-width:820px;margin:auto}.card{background:#fff;margin:18px 0;padding:20px;border:1px solid #d7dee8;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:bold;font-size:14px}input,select{box-sizing:border-box;width:100%;padding:10px;margin-top:5px;border:1px solid #aab8c8;border-radius:7px;font:inherit}button{background:#124b89;color:#fff;border:0;border-radius:8px;padding:13px;font-weight:bold;font-size:16px;cursor:pointer}.full{grid-column:1/-1}.hint{font-size:13px;color:#667085}.ok{background:#e5f7ea;padding:16px;border-radius:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><body><header class="hero"><div class="wrap"><b>CAIC · CASTRO/PR</b><h1>Rematrículas 2027</h1><p>Confirme os dados, envie os documentos e aguarde a orientação para assinatura presencial.</p></div></header><main class="wrap"><div id="result"></div><form id="f"><section class="card"><h2>1. Identificação</h2><div class="grid"><label>Turma<select id="turma" required><option>Carregando...</option></select></label><label>Aluno(a)<select id="aluno" required disabled><option>Selecione a turma</option></select></label><label class="full">Data de nascimento <small>(confirmação de segurança)</small><input id="nascimento" type="date" required disabled></label><div class="full"><button type="button" id="load" disabled>Carregar cadastro</button><p class="hint" id="msg">Selecione turma, aluno e informe a data de nascimento.</p></div></div></section><section class="card" id="details" hidden><h2>2. Conferência e documentos</h2><div class="grid"><label>Nome do(a) estudante<input name="aluno_nome" required></label><label>Nome do responsável<input name="responsavel_nome" required></label><label>Telefone/WhatsApp<input name="telefone" required></label><label>E-mail<input name="email" type="email"></label><label class="full">Endereço atualizado<input name="endereco" required></label><label>Foto da conta de luz atualizada<input name="conta_luz" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" capture="environment" required></label><label>Declaração/comprovante de vacinação<input name="vacinacao" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" capture="environment" required></label><div class="full"><label><input type="checkbox" required> Confirmo que as informações e os documentos são verdadeiros e comparecerei para assinar o formulário oficial.</label></div><div class="full"><button>Enviar rematrícula</button></div></div></section></form></main><script>const api='https://agrghfjrtkngkugotgwb.supabase.co/functions/v1/rematricula-2027-public',$=x=>document.querySelector(x),t=$('#turma'),a=$('#aluno'),n=$('#nascimento'),l=$('#load'),d=$('#details'),m=$('#msg'),f=$('#f'),r=$('#result');async function q(u,o){let x=await fetch(u,o),j=await x.json();if(!x.ok)throw Error(j.erro);return j}q(api+'?action=turmas').then(j=>t.innerHTML='<option value="">Selecione</option>'+j.turmas.map(x=>'<option>'+x+'</option>').join('')).catch(e=>m.textContent=e.message);t.onchange=async()=>{let j=await q(api+'?action=alunos&turma='+encodeURIComponent(t.value));a.innerHTML='<option value="">Selecione</option>'+j.alunos.map(x=>'<option>'+x+'</option>').join('');a.disabled=false};function ready(){l.disabled=!(a.value&&n.value)}a.onchange=()=>{n.disabled=!a.value;ready()};n.oninput=ready;l.onclick=async()=>{try{let j=await q(api+'?action=responsavel',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({turma:t.value,nome:a.value,nascimento:n.value})});f.aluno_nome.value=j.aluno;f.responsavel_nome.value=j.responsavel;d.hidden=false;m.textContent='Confira e corrija se necessário.'}catch(e){m.textContent=e.message}};f.onsubmit=async e=>{e.preventDefault();if(!f.reportValidity())return;let fd=new FormData(f);fd.append('turma',t.value);try{let j=await q(api+'?action=enviar',{method:'POST',body:fd});f.hidden=true;r.innerHTML='<p class="ok"><b>Rematrícula recebida!</b><br>Protocolo: '+j.protocolo+'. Guarde este número.</p>'}catch(e){alert(e.message)}};</script></body></html>
