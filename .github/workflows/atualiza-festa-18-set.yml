name: Atualizar Festa da Primavera 18-09

on:
  push:
    paths:
      - '.github/workflows/atualiza-festa-18-set.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar atualização no site
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/atualiza-festa-18-set.yml
          git commit -m "Atualiza avisos e bastidores da Festa da Primavera"
          git push
