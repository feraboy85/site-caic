name: Atualizar Festa da Primavera 18-09

on:
  push:
    paths:
      - '.github/workflows/atualiza-festa-18-set.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar avisos e galeria da festa
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
    .activity-alert{margin:0 0 22px;background:linear-gradient(120deg,#fff7db,#fff);border:2px solid rgba(255,201,40,.55);border-radius:22px;padding:22px 24px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;box-shadow:0 8px 24px rgba(8,39,69,.06)}
    .activity-alert-icon{width:50px;height:50px;border-radius:16px;background:#fff0b8;display:grid;place-items:center;font-size:1.6rem}
    .activity-alert .tag{display:inline-flex;background:#fff0b8;color:#775c00;font-size:.72rem;font-weight:900;padding:6px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
    .activity-alert h3{margin:10px 0 6px;color:var(--navy);font-size:1.35rem;line-height:1.18}
    .activity-alert p{margin:0;color:var(--muted)}
    .activity-alert .date{margin-top:12px;color:#718499;font-size:.82rem;font-weight:800}

    .prep-feature{margin:0 0 30px;background:linear-gradient(135deg,#fff8fc,#f5fbff);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 10px 30px rgba(8,39,69,.06)}
    .prep-copy{max-width:760px;margin-bottom:18px}
    .prep-copy h3{font-size:clamp(1.55rem,3vw,2.25rem);line-height:1.08;letter-spacing:-.035em;color:var(--navy);margin:7px 0 8px}
    .prep-copy p{color:var(--muted);margin:0}
    .prep-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .prep-photo{aspect-ratio:4/5;border-radius:17px;overflow:hidden;position:relative;cursor:pointer;background:#eaf0f5}
    .prep-photo img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease}
    .prep-photo:hover img{transform:scale(1.035)}
    .prep-photo:after{content:"Ampliar";position:absolute;right:9px;bottom:9px;background:rgba(6,31,55,.78);color:#fff;padding:5px 8px;border-radius:999px;font-size:.68rem;font-weight:800;backdrop-filter:blur(8px)}
'''
          if '.activity-alert{' not in s:
              s = s.replace('    .news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}', css + '\n    .news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}', 1)

          # Regras responsivas extras, mantidas separadas para não interferir no CSS atual.
          responsive = r'''
    @media(max-width:920px){.prep-gallery{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:620px){.activity-alert{grid-template-columns:1fr;padding:20px}.activity-alert-icon{width:44px;height:44px}.prep-feature{padding:18px}.prep-gallery{grid-template-columns:1fr}.prep-photo{aspect-ratio:4/3}}
'''
          if '@media(max-width:920px){.prep-gallery' not in s:
              s = s.replace('  </style>', responsive + '  </style>', 1)

          aviso = r'''
        <article class="activity-alert">
          <div class="activity-alert-icon">📣</div>
          <div>
            <span class="tag">18/09 • Hoje à tarde</span>
            <h3>Futsal e ballet não serão realizados hoje</h3>
            <p><strong>Futsal:</strong> hoje não haverá atividade, pois o ginásio está preparado para a Festa da Primavera. <strong>Ballet:</strong> hoje também não haverá aula.</p>
            <div class="date">Direção • 18/09/2026</div>
          </div>
        </article>
'''
          if 'Futsal e ballet não serão realizados hoje' not in s:
              s = s.replace('      <div class="notice-grid">', aviso + '\n      <div class="notice-grid">', 1)

          galeria = r'''
      <div class="prep-feature">
        <div class="prep-copy">
          <div class="kicker">Preparativos</div>
          <h3>Bastidores da Festa da Primavera 🌸🦋</h3>
          <p>O CAIC já está ganhando as cores da festa. Os ambientes estão sendo preparados para receber as famílias neste sábado. Confira alguns registros da decoração e da organização dos espaços.</p>
        </div>
        <div class="prep-gallery">
          <div class="prep-photo" data-image="assets/noticias/ambiente-festa-01.webp" data-alt="Decoração dos ambientes para a Festa da Primavera"><img loading="lazy" src="assets/noticias/ambiente-festa-01.webp" alt="Flores decorativas nos ambientes da Festa da Primavera"></div>
          <div class="prep-photo" data-image="assets/noticias/ambiente-festa-02.webp" data-alt="Corredor decorado para a Festa da Primavera"><img loading="lazy" src="assets/noticias/ambiente-festa-02.webp" alt="Corredor do CAIC decorado com flores e borboletas"></div>
          <div class="prep-photo" data-image="assets/noticias/ambiente-festa-03.webp" data-alt="Entrada do ginásio preparada para a Festa da Primavera"><img loading="lazy" src="assets/noticias/ambiente-festa-03.webp" alt="Entrada do ginásio preparada e decorada para a Festa da Primavera"></div>
        </div>
      </div>
'''
          if 'Bastidores da Festa da Primavera' not in s:
              s = s.replace('      <div class="news-grid">', galeria + '\n      <div class="news-grid">', 1)

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/atualiza-festa-18-set.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/atualiza-festa-18-set.yml
          git commit -m "Atualiza avisos e bastidores da Festa da Primavera"
          git push
