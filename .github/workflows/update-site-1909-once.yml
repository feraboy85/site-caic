name: Atualizar destaque e avisos 1909

on:
  push:
    paths:
      - .github/workflows/update-site-1909-once.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar patch
        run: echo '' | base64 -d > /tmp/patch.py
      - name: Aplicar patch
        run: python3 /tmp/patch.py
      - name: Salvar alteracoes
        run: |
          rm -f .github/workflows/update-site-1909-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-site-1909-once.yml
          git commit -m "Alterna hero com É Hoje e mantém só aviso da festa"
          git push
